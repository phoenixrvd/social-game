services:
  app:
    image: ghcr.io/phoenixrvd/social-game:latest
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    env_file:
      - .env
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./.data:/app/.data:rw
      - ./.overrides:/app/.overrides:rw
